version: '3.8'

services:
 

  app_dev:
    image: drillendeavour/jee-backend:dev 
    container_name: development
    restart: always 
    env_file:
      - .env 
    ports: 
      - "3000:3005" 
    


  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always


  # This service runs once to automatically pull your model
  ollama_pull:
    image: curlimages/curl:latest
    container_name: ollama_pull
    depends_on:
      - ollama
    # REPLACE "llama3" with the exact model name you want (e.g., mistral, gemma)
    command: >
      sh -c "sleep 5 && curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3\"}'"
    restart: "no"


volumes:
  ollama_data:
    